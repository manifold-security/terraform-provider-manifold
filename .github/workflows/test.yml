name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -v ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: go test -v -cover -timeout=120s ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - run: make generate
      - name: Generated code and docs are committed
        run: git diff --exit-code

  acceptance:
    needs: build
    if: vars.MANIFOLD_ENDPOINT != ''
    runs-on: ubuntu-latest
    env:
      MANIFOLD_ENDPOINT: ${{ vars.MANIFOLD_ENDPOINT }}
      MANIFOLD_AUTH_DOMAIN: ${{ vars.MANIFOLD_AUTH_DOMAIN }}
      MANIFOLD_ORGANIZATION: ${{ vars.MANIFOLD_ORGANIZATION }}
      MANIFOLD_CLIENT_ID: ${{ secrets.MANIFOLD_CLIENT_ID }}
      MANIFOLD_CLIENT_SECRET: ${{ secrets.MANIFOLD_CLIENT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        tofu: ["1.12.*", "1.13.*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false
      - run: make testacc
